[package]
name = "qqmusic-lan-sync"
version = "0.1.0"
description = "Synchronize QQ Music playback and lyrics across a Windows LAN"
authors = ["QQMusic LAN Sync contributors"]
license = "MIT AND Apache-2.0"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "qqmusic_lan_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hostname = "0.4"
html-escape = "0.2"
if-addrs = "0.13"
local-ip-address = "0.6"
lyrics-crypto = "0.1.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
strsim = "0.11"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media_Control"] }
